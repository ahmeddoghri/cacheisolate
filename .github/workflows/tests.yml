name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - name: Isolation must stay leak-free
        run: |
          cacheisolate demo > /tmp/c.json
          python -c "import json; d=json.load(open('/tmp/c.json')); assert d['shared_cache_leaks'], d; assert not d['isolated_cache_leaks'] and not d['selective_cache_leaks'], d"

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t cacheisolate:ci .
      - name: Smoke-test the workbench
        run: |
          docker run -d --name ci -p 8090:8090 cacheisolate:ci
          for i in $(seq 1 20); do curl -sf http://localhost:8090/ >/dev/null && break; sleep 1; done
          curl -sf http://localhost:8090/ | grep -qi '<html'
