<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>cacheisolate</title><style>:root{color-scheme:dark;--bg:#07090b;--panel:#0c1115;--line:#24343e;--text:#edf5f9;--muted:#8ea1ad;--accent:#72c7ff;--bad:#ff7d78;--ok:#65e6a7}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:0}header{height:64px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 max(20px,calc((100vw - 1180px)/2))}h1{font-size:17px;margin:0}.status{color:var(--accent)}main{max-width:1180px;margin:auto;padding:34px 24px 56px}.intro{display:grid;grid-template-columns:1.15fr .85fr;gap:42px;align-items:end;margin-bottom:28px}h2{font:650 38px/1.08 system-ui,sans-serif;margin:0}.intro p{color:var(--muted);margin:0}.grid{display:grid;grid-template-columns:1.25fr .75fr;border:1px solid var(--line);min-height:560px}.visual,.side{padding:22px}.visual{border-right:1px solid var(--line)}.label{color:var(--muted);font-size:11px;text-transform:uppercase;margin-bottom:12px}.policies{display:grid;gap:13px}.policy{border:1px solid var(--line);background:var(--panel);padding:16px}.head{display:flex;align-items:center;justify-content:space-between}.head b{font:650 18px system-ui,sans-serif}.leak{color:var(--bad)}.safe{color:var(--ok)}.timeline{display:flex;gap:9px;margin:18px 0 8px}.event{flex:1;height:62px;border:1px solid var(--line);display:grid;place-items:center;position:relative;background:#07090b}.event.hit{border-color:var(--accent)}.event.cross{box-shadow:inset 0 -4px var(--bad)}.event.public.cross{box-shadow:inset 0 -4px var(--ok)}.event span{font-size:11px}.event small{position:absolute;bottom:4px;color:var(--muted);font-size:9px}.stats{color:var(--muted);font-size:11px}textarea{width:100%;height:430px;resize:none;border:1px solid var(--line);background:#050709;color:var(--text);padding:13px;font:10px/1.4 inherit}button{height:42px;margin-top:14px;border:0;padding:0 18px;background:var(--accent);color:#071016;font:700 13px inherit;cursor:pointer}@media(max-width:800px){main{padding:24px 16px}.intro{grid-template-columns:1fr;gap:12px}h2{font-size:30px}.grid{grid-template-columns:1fr}.visual{border-right:0;border-bottom:1px solid var(--line)}header{padding:0 16px}.timeline{gap:4px}.event{height:50px}.event span{font-size:9px}textarea{height:300px}}</style></head><body><header><h1>cacheisolate / side-channel audit</h1><span class="status">timing model active</span></header><main><section class="intro"><h2>A faster response can reveal another user's prompt.</h2><p>Replay the same tenant sequence against three cache policies and measure leakage separately from useful prefix reuse.</p></section><section class="grid"><div class="visual"><div class="label">Policy comparison</div><div id="policies" class="policies"></div></div><div class="side"><div class="label">Tenant request trace</div><textarea id="input"></textarea><button id="run">Replay policies</button></div></section></main><script>const input=document.querySelector('#input');function draw(d){policies.innerHTML=d.policies.map(p=>'<div class="policy"><div class="head"><b>'+p.policy.replaceAll('_',' ')+'</b><span class="'+(p.leak_detected?'leak':'safe')+'">'+(p.leak_detected?'LEAK: '+p.inferred_private_value:'NO PRIVATE INFERENCE')+'</span></div><div class="timeline">'+p.timeline.map(e=>'<div class="event '+(e.hit?'hit ':'')+(e.cross_tenant?'cross ':'')+(!e.sensitive?'public':'')+'"><span>'+e.latency_ms+'ms</span><small>'+e.tenant.split('-')[0]+'</small></div>').join('')+'</div><div class="stats">hits '+p.cache_hits+' / cross-tenant '+p.cross_tenant_hits+' / safe shared '+p.safe_shared_hits+'</div></div>').join('')}async function demo(){const d=await fetch('/api/demo').then(r=>r.json());input.value=JSON.stringify(d.input,null,2);draw(d.result)}async function run(){const r=await fetch('/api/analyze',{method:'POST',headers:{'content-type':'application/json'},body:input.value});const d=await r.json();if(!d.error)draw(d)}document.querySelector('#run').onclick=run;demo();</script></body></html>
